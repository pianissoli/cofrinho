name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag %s; expected vMAJOR.MINOR.PATCH\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build Docker toolchain
        run: docker build --tag cofrinho-build .

      - name: Run checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            cofrinho-build check

      - name: Package Linux x86_64 CLI
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            cofrinho-build :apps:cli:packageLinuxX64

          mkdir -p "$RUNNER_TEMP/cofrinho-release"
          cli_archive="cofrinho-$GITHUB_REF_NAME-linux-x86_64.tar.gz"
          tar -C apps/cli/build/package \
            -czf "$RUNNER_TEMP/cofrinho-release/$cli_archive" \
            cofrinho-linux-x86_64
          cd "$RUNNER_TEMP/cofrinho-release"
          sha256sum "$cli_archive" > "$cli_archive.sha256"
          cp "$GITHUB_WORKSPACE/scripts/install_cli.py" "$RUNNER_TEMP/cofrinho-release/cofrinho-install_cli.py"
          sha256sum cofrinho-install_cli.py > cofrinho-install_cli.py.sha256
          cp "$GITHUB_WORKSPACE/scripts/cli_install_archive.py" "$RUNNER_TEMP/cofrinho-release/cli_install_archive.py"
          sha256sum cli_install_archive.py > cli_install_archive.py.sha256

      - name: Smoke test CLI archive without system Java
        run: |
          mkdir -p "$RUNNER_TEMP/cofrinho-cli-smoke/extracted package"
          tar -xzf "$RUNNER_TEMP/cofrinho-release/cofrinho-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            -C "$RUNNER_TEMP/cofrinho-cli-smoke/extracted package"

          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env JAVA_HOME=/missing-system-java \
            --volume "$RUNNER_TEMP/cofrinho-cli-smoke:/smoke" \
            --entrypoint /bin/bash \
            ubuntu:22.04 -ceu '
              if command -v java >/dev/null 2>&1; then
                printf "Expected a smoke-test container without system Java\n" >&2
                exit 1
              fi
              cli="/smoke/extracted package/cofrinho-linux-x86_64/bin/cofrinho"
              "$cli" --help
              "$cli" --db /smoke/source.sqlite setup --currency BRL
              "$cli" --db /smoke/source.sqlite income add --name Salary --amount 3000 --from 2026-11
              "$cli" --db /smoke/source.sqlite recurring add --name Rent --amount 100 --from 2026-11
              "$cli" --db /smoke/source.sqlite expense add --amount 10 --date 2026-11-02
              "$cli" --db /smoke/source.sqlite budget show --month 2026-11 --json > /smoke/before.json
              "$cli" --db /smoke/source.sqlite transfer export --file /smoke/outbound.cofrinho
              "$cli" --db /smoke/target.sqlite setup --currency BRL
              "$cli" --db /smoke/target.sqlite transfer import --file /smoke/outbound.cofrinho
              "$cli" --db /smoke/target.sqlite budget show --month 2026-11 --json > /smoke/imported.json
              "$cli" --db /smoke/target.sqlite transfer export --file /smoke/returned.cofrinho
              "$cli" --db /smoke/source.sqlite transfer import --file /smoke/returned.cofrinho
              "$cli" --db /smoke/source.sqlite budget show --month 2026-11 --json > /smoke/after.json
            '

          jq --exit-status \
            '.budget == "3000.00" and .spent == "10.00" and .recurring == "100.00" and .used == "110.00" and .available == "2890.00"' \
            "$RUNNER_TEMP/cofrinho-cli-smoke/before.json"
          cmp "$RUNNER_TEMP/cofrinho-cli-smoke/before.json" "$RUNNER_TEMP/cofrinho-cli-smoke/imported.json"
          cmp "$RUNNER_TEMP/cofrinho-cli-smoke/before.json" "$RUNNER_TEMP/cofrinho-cli-smoke/after.json"

      - name: Smoke test packaged TUI with a pseudo-terminal
        run: |
          cli="$RUNNER_TEMP/cofrinho-cli-smoke/extracted package/cofrinho-linux-x86_64/bin/cofrinho"
          tui_db="$RUNNER_TEMP/cofrinho-cli-smoke/tui.sqlite"
          "$cli" --db "$tui_db" setup --currency BRL
          "$cli" --db "$tui_db" income add --name Salary --amount 3000 --from 2026-11
          "$cli" --db "$tui_db" recurring add --name Rent --amount 100 --from 2026-11
          python3 scripts/cli_tui_pty_smoke.py "$cli" "$tui_db"
          "$cli" --db "$tui_db" budget show --month 2026-11 --json > "$RUNNER_TEMP/cofrinho-cli-smoke/tui.json"
          jq --exit-status '.spent == "10.00" and .recurring == "100.00" and .available == "2890.00" and .budget == "3000.00"' \
            "$RUNNER_TEMP/cofrinho-cli-smoke/tui.json"

      - name: Smoke test the standalone installer
        run: |
          install_home="$RUNNER_TEMP/cofrinho-install"
          python3 scripts/install_cli.py \
            "$RUNNER_TEMP/cofrinho-release/cofrinho-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            --install-dir "$install_home/opt/cofrinho" \
            --bin-dir "$install_home/bin"
          "$install_home/bin/cofrinho" --help
          test -L "$install_home/bin/cofrinho"

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              printf 'Missing %s; expected a nonempty repository secret\n' "$secret_name" >&2
              exit 1
            fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/cofrinho-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/cofrinho-signing/cofrinho-release.p12"

          # Inject signing only at runtime so the private key never enters the image.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --volume "$RUNNER_TEMP/cofrinho-signing:/signing:ro" \
            --env ANDROID_STORE_PASSWORD \
            --env ANDROID_KEY_ALIAS \
            --env ANDROID_KEY_PASSWORD \
            --entrypoint bash \
            cofrinho-build -ceu '
              exec /opt/cofrinho-wrapper/gradlew --no-daemon :apps:android:assembleRelease \
                -Pandroid.injected.signing.store.file=/signing/cofrinho-release.p12 \
                -Pandroid.injected.signing.store.type=PKCS12 \
                "-Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD" \
                "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
                "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            '

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cofrinho-signing/cofrinho-release.p12"

      - name: Verify and prepare release assets
        run: |
          apk_directory=apps/android/build/outputs/apk/release
          apk_version=$(jq --exit-status --raw-output '.elements[0].versionName' "$apk_directory/output-metadata.json")
          if [[ "$GITHUB_REF_NAME" != "v$apk_version" ]]; then
            printf 'Tag %s does not match APK version %s; expected v%s\n' "$GITHUB_REF_NAME" "$apk_version" "$apk_version" >&2
            exit 1
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace:ro" \
            --entrypoint apksigner \
            cofrinho-build verify --verbose --print-certs \
            "/workspace/$apk_directory/cofrinho-release.apk"

          mkdir -p "$RUNNER_TEMP/cofrinho-release"
          cp "$apk_directory/cofrinho-release.apk" "$RUNNER_TEMP/cofrinho-release/cofrinho-$GITHUB_REF_NAME.apk"
          cd "$RUNNER_TEMP/cofrinho-release"
          sha256sum "cofrinho-$GITHUB_REF_NAME.apk" > "cofrinho-$GITHUB_REF_NAME.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/cofrinho-release/cofrinho-$GITHUB_REF_NAME.apk" \
            "$RUNNER_TEMP/cofrinho-release/cofrinho-$GITHUB_REF_NAME.apk.sha256" \
            "$RUNNER_TEMP/cofrinho-release/cofrinho-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            "$RUNNER_TEMP/cofrinho-release/cofrinho-$GITHUB_REF_NAME-linux-x86_64.tar.gz.sha256" \
            "$RUNNER_TEMP/cofrinho-release/cofrinho-install_cli.py" \
            "$RUNNER_TEMP/cofrinho-release/cofrinho-install_cli.py.sha256" \
            "$RUNNER_TEMP/cofrinho-release/cli_install_archive.py" \
            "$RUNNER_TEMP/cofrinho-release/cli_install_archive.py.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Cofrinho $GITHUB_REF_NAME" \
            --generate-notes
